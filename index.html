<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maison de Joie – Order Form</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#17300d;--card:#1f3d14;--line:#b8923a;--gold:#e0b858;--text:#f6f1e3;--muted:#c9d1bd;--field:#12270a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:28px 18px 48px}
header{text-align:center;padding:10px 0 24px}
.logo{font-family:'Pinyon Script',cursive;font-size:3rem;line-height:1.05;margin:0}
.est{letter-spacing:.25em;font-size:.7rem;color:var(--gold);margin-top:8px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px 0}
.notice{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.9rem;text-align:center;color:var(--muted)}
.notice b{color:var(--gold)}
section{margin-top:26px}
h2{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--gold);margin:0 0 10px;font-weight:600}
label.f{display:block;font-size:.85rem;color:var(--muted);margin-bottom:12px}
input,textarea{width:100%;margin-top:4px;padding:11px 12px;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid rgba(184,146,58,.3)}
.item .n{flex:1}.item .p{color:var(--gold);font-size:.85rem}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:1.1rem;cursor:pointer}
.qty input{width:48px;margin:0;text-align:center;padding:6px 2px}
.total{display:flex;justify-content:space-between;font-family:'Cormorant Garamond',serif;font-size:1.4rem;margin-top:22px}
.total span:last-child{color:var(--gold)}
.submit{width:100%;margin-top:18px;padding:14px;border:0;border-radius:999px;background:linear-gradient(135deg,#f0cd75,#b8923a);color:#17300d;font:600 1rem Inter,sans-serif;letter-spacing:.06em;cursor:pointer}
.msg{margin-top:14px;font-size:.88rem;text-align:center;color:var(--muted)}
.err{color:#ffb4a4}
.copy{background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;font:inherit}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1 class="logo">Maison de Joie</h1>
<div class="est">EST. 2025</div>
</header>
<div class="notice"><b>Pick-up only.</b> Walang delivery. Pakipili ang petsa at oras ng pick-up.</div>
<div class="notice" style="margin-top:10px">📍 <b>Pick-up Address:</b> <span id="addr"></span></div>

<form id="f" novalidate>
<section>
<h2>Your Details</h2>
<label class="f">Full Name *<input id="name" required autocomplete="name"></label>
<div class="row2">
<label class="f">Mobile Number *<input id="phone" type="tel" required autocomplete="tel"></label>
<label class="f">Email (optional)<input id="email" type="email" autocomplete="email"></label>
</div>
<div class="row2">
<label class="f">Pick-up Date *<input id="date" type="date" required></label>
<label class="f">Pick-up Time *<input id="time" type="time" required></label>
</div>
</section>

<div class="rule"></div>
<div id="menu"></div>

<section>
<h2>Notes</h2>
<label class="f">Special requests / allergies<textarea id="notes" rows="3"></textarea></label>
</section>

<div class="total"><span>Estimated Total</span><span id="total">₱0</span></div>
<button class="submit" type="submit">SUBMIT ORDER</button>
<div class="msg" id="msg"></div>
</form>
</div>

<script>
// ============ SETTINGS (pwedeng i-edit) ============
// Address ng pick-up (lalabas sa taas ng form):
var PICKUP_ADDRESS="1234 SCT Laging Handa, Quezon City";
// FormSubmit ID: ngayon ay email mo. Kapag nakuha mo na ang random code
// mula sa FormSubmit, ipalit mo dito (halimbawa "a1b2c3d4e5...").
var FORMSUBMIT_ID="e764a0ce0ac34b8a98e009aeed7a8d09";
document.getElementById("addr").textContent=PICKUP_ADDRESS;
// ============ EDIT MENU HERE ============
// Bawat grupo: ["Pangalan ng grupo",[ ["Pangalan ng item", presyo], ... ]]
// Item format: ["Pangalan ng item", presyo],  (may kuwit sa dulo ng bawat item)
// Para magdagdag: kopyahin ang isang linya. Para magtanggal: burahin ang linya.
var MENU=[
 ["Sourdough",[
  ["Hearty Sourdough",340],["Walnut and Cranberry",400],["MultiSeeds",390],["Black Sesame",360],
  ["Dark Chocolate",410],["Olives and Rosemary",360],["Cheddar and Jalapeno",450],["Blueberry",420]
 ]],
 ["Focaccia",[
  ["Sea Salt (Plain)",300],["Spicy Tuyo w/ Cherry Tomato",340],["Olives and Rosemary",320],
  ["Scallion and Chili Garlic",340],["Cheddar & Jalapeno",420],["Pesto & Cherry Tomato",350]
 ]],
 ["Burnt Cheesecake",[
  ["New York (Plain)",290],["Biscoff",310],["Blueberry",320],["Oreo",290]
 ]],
 ["Croissant",[
  ["Butter Croissant",120],["Ham & Cheese",160],["Bacon Sausage",170],["Pain Au Chocolat",140],
  ["Twice Baked Almond",200],["Pepperoni Croizza",150],["Bacon Mushroom Croizza",150],["Multiseed Croissant",130],
  ["White Chocolate Vanilla Flan",180],["Cinnamon",130],["Punch Amann",130],["Pastel de Nata (Tart)",75],
  ["Salted Caramel Brownie",190],["Chicken Mushroom",210],["Tuna",210]
 ]],
 ["Others",[
  ["Cheeseroll",75],["Ensaymada",120],["Chewy Brownie by 4's",320]
 ]]
];
// ========================================
var EMAIL="maisondejoie0216@gmail.com",rows=[];
function build(c,cat,list){
 list.forEach(function(it){
  var d=document.createElement("div");d.className="item";
  d.innerHTML='<div class="n">'+it[0]+'<div class="p">₱'+it[1]+'</div></div><div class="qty"><button type="button" aria-label="minus">−</button><input type="number" min="0" max="99" value="0" inputmode="numeric" aria-label="Quantity"><button type="button" aria-label="plus">+</button></div>';
  var inp=d.querySelector("input"),b=d.querySelectorAll("button");
  b[0].onclick=function(){inp.value=Math.max(0,+inp.value-1);calc()};
  b[1].onclick=function(){inp.value=Math.min(99,+inp.value+1);calc()};
  inp.oninput=calc;
  c.appendChild(d);rows.push({n:cat+": "+it[0],p:it[1],i:inp});
 });
}
MENU.forEach(function(g){
 var sec=document.createElement("section");
 sec.innerHTML="<h2></h2><div></div>";
 sec.querySelector("h2").textContent=g[0];
 document.getElementById("menu").appendChild(sec);
 build(sec.querySelector("div"),g[0],g[1]);
});
function calc(){
 var t=0;rows.forEach(function(r){t+=(+r.i.value||0)*r.p});
 document.getElementById("total").textContent="₱"+t;return t;
}
var dt=new Date();
document.getElementById("date").min=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");

var lastText="";
function g(id){return document.getElementById(id).value.trim()}
document.getElementById("f").addEventListener("submit",function(e){
 e.preventDefault();
 var m=document.getElementById("msg");m.className="msg";
 if(!g("name")||!g("phone")||!g("date")||!g("time")){m.className="msg err";m.textContent="Pakilagay ang name, mobile number, at pick-up date/time.";return}
 var lines=[];rows.forEach(function(r){var q=+r.i.value||0;if(q>0)lines.push("- "+q+" x "+r.n+" (₱"+(q*r.p)+")")});
 if(!lines.length){m.className="msg err";m.textContent="Pumili po ng kahit isang item.";return}
 lastText="NEW ORDER – PICK-UP\n\nName: "+g("name")+"\nMobile: "+g("phone")+"\nEmail: "+(g("email")||"-")+
  "\nPick-up: "+g("date")+" at "+g("time")+"\n\nORDER:\n"+lines.join("\n")+"\n\nEstimated Total: ₱"+calc()+"\nNotes: "+(g("notes")||"-");
 var subject="Order from "+g("name")+" – Pick-up "+g("date");
 var btn=document.querySelector(".submit");btn.disabled=true;btn.textContent="SENDING...";
 var fallback=function(){
  btn.disabled=false;btn.textContent="SUBMIT ORDER";
  var url="mailto:"+EMAIL+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(lastText);
  m.innerHTML='Hindi automatic na naipadala. Bubuksan ang email app mo — pindutin ang <b>Send</b>. Hindi bumukas? <button type="button" class="copy" id="cp">Kopyahin ang order</button> at i-email sa '+EMAIL+'.';
  document.getElementById("cp").onclick=function(){
   try{navigator.clipboard.writeText(lastText);this.textContent="Nakopya!"}catch(x){window.prompt("Copy:",lastText)}
  };
  window.location.href=url;
 };
 var data={_subject:subject,_template:"table",_captcha:"false",_honey:"",
  Name:g("name"),Mobile:g("phone"),"Pick-up":g("date")+" at "+g("time"),
  Order:lines.join("\n"),Total:"₱"+calc(),Notes:g("notes")||"-"};
 if(g("email"))data.email=g("email");
 fetch("https://formsubmit.co/ajax/"+FORMSUBMIT_ID,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(data)})
 .then(function(r){return r.json()})
 .then(function(d){
  if(d.success!=="true"&&d.success!==true)throw 0;
  btn.disabled=false;btn.textContent="SUBMIT ORDER";
  m.className="msg";m.innerHTML="<b style='color:var(--gold)'>Salamat!</b> Natanggap na namin ang order mo. Hintayin ang confirmation mula sa Maison de Joie.";
  document.getElementById("f").reset();rows.forEach(function(r){r.i.value=0});calc();
 }).catch(fallback);
});
</script>
</body>
</html>
